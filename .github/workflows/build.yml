name: Build Apple Color Emoji font

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build Linux font (ppem=64)
        run: python convert.py --ppem 64 --target linux --output output/AppleColorEmoji.ttf

      - name: Build Windows font (ppem=64)
        run: python convert.py --ppem 64 --target windows --output output/AppleColorEmoji-Windows.ttf

      - name: Show font sizes
        run: ls -lh output/

      - name: Upload font artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apple-color-emoji-fonts
          path: |
            output/AppleColorEmoji.ttf
            output/AppleColorEmoji-Windows.ttf
